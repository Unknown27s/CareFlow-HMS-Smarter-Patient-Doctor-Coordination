<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - CareFlow HMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2em;
        }

        .logout-btn {
            background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 20px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
        }

        .panel {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1em;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔧 Admin Panel</h1>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>

        <!-- Statistics -->
        <div class="panel">
            <h2>📊 System Statistics</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalDoctors">0</h3>
                    <p>Total Doctors</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalPatients">0</h3>
                    <p>Total Patients</p>
                </div>
                <div class="stat-card">
                    <h3 id="todayQueue">0</h3>
                    <p>Today's Queue</p>
                </div>
            </div>
        </div>

        <!-- Add Doctor Panel -->
        <div class="panel">
            <h2>👨‍⚕️ Add New Doctor</h2>
            <div id="message" class="message"></div>

            <form id="addDoctorForm" onsubmit="addDoctor(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Doctor Name *</label>
                        <input type="text" id="doctorName" required placeholder="Dr. John Smith">
                    </div>
                    <div class="form-group">
                        <label>Doctor ID/Username *</label>
                        <input type="text" id="doctorId" required placeholder="DOC001">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" id="doctorPassword" required placeholder="Enter password">
                    </div>
                    <div class="form-group">
                        <label>Department *</label>
                        <select id="doctorDepartment" required>
                            <option value="">Select Department</option>
                            <option value="General">General Medicine</option>
                            <option value="ENT">ENT</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="Neurology">Neurology</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary">➕ Add Doctor</button>
            </form>
        </div>

        <!-- Doctors List -->
        <div class="panel">
            <h2>👥 Registered Doctors</h2>
            <table id="doctorsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="doctorsTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center;">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Check admin authentication
        function checkAdminAuth() {
            const adminSession = localStorage.getItem('adminSession');
            if (!adminSession) {
                window.location.href = 'adminLogin.html';
                return false;
            }
            return true;
        }

        // Check auth on load
        if (!checkAdminAuth()) {
            // Will redirect
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('adminSession');
                window.location.href = 'adminLogin.html';
            }
        }

        // Add doctor
        async function addDoctor(event) {
            event.preventDefault();

            const name = document.getElementById('doctorName').value;
            const username = document.getElementById('doctorId').value;
            const password = document.getElementById('doctorPassword').value;
            const department = document.getElementById('doctorDepartment').value;

            try {
                const response = await fetch('http://localhost:3000/api/admin/doctors', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password,
                        name,
                        department,
                        role: 'doctor'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Doctor added successfully!', 'success');
                    document.getElementById('addDoctorForm').reset();
                    loadDoctors();
                    loadStatistics();
                } else {
                    showMessage('Error: ' + (data.error || 'Failed to add doctor'), 'error');
                }
            } catch (error) {
                console.error('Error adding doctor:', error);
                showMessage('Error: Failed to add doctor. Please make sure the server is running.', 'error');
            }
        }

        // Load doctors list
        async function loadDoctors() {
            try {
                const response = await fetch('http://localhost:3000/api/admin/doctors');
                const data = await response.json();

                const tbody = document.getElementById('doctorsTableBody');

                if (data.success && data.doctors.length > 0) {
                    tbody.innerHTML = data.doctors.map(doctor => `
                        <tr>
                            <td>${doctor.username}</td>
                            <td>${doctor.name}</td>
                            <td>${doctor.department}</td>
                            <td>${new Date(doctor.created_at).toLocaleDateString()}</td>
                            <td>
                                <button class="btn-danger" onclick="deleteDoctor(${doctor.id}, '${doctor.username}')">
                                    🗑️ Delete
                                </button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No doctors registered yet</td></tr>';
                }
            } catch (error) {
                console.error('Error loading doctors:', error);
            }
        }

        // Delete doctor
        async function deleteDoctor(id, username) {
            if (!confirm(`Are you sure you want to delete doctor: ${username}?`)) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/admin/doctors/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Doctor deleted successfully!', 'success');
                    loadDoctors();
                    loadStatistics();
                } else {
                    showMessage('Error: ' + (data.error || 'Failed to delete doctor'), 'error');
                }
            } catch (error) {
                console.error('Error deleting doctor:', error);
                showMessage('Error: Failed to delete doctor', 'error');
            }
        }

        // Load statistics
        async function loadStatistics() {
            try {
                const response = await fetch('http://localhost:3000/api/stats');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('totalDoctors').textContent = data.stats.totalDoctors || 0;
                    document.getElementById('totalPatients').textContent = data.stats.totalPatients || 0;
                    document.getElementById('todayQueue').textContent = data.stats.today.total || 0;
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        // Show message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;

            setTimeout(() => {
                messageEl.className = 'message';
            }, 5000);
        }

        // Initialize on load
        window.onload = function () {
            loadDoctors();
            loadStatistics();
        };
    </script>
</body>

</html>
