<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CareFlow HMS</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Theme CSS -->
    <link rel="stylesheet" href="styles/theme.css">

    <style>
        body {
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #fae8ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.6s ease-out;
        }

        .login-card {
            background: white;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            overflow: hidden;
        }

        .login-header {
            background: var(--gradient-hero);
            padding: var(--space-10) var(--space-8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: float 6s ease-in-out infinite;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto var(--space-5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .login-header h1 {
            color: white;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: var(--space-2);
            position: relative;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            position: relative;
        }

        .login-form {
            padding: var(--space-8);
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--neutral-700);
            margin-bottom: var(--space-2);
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: var(--space-4);
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--neutral-400);
        }

        .form-group input {
            width: 100%;
            padding: var(--space-4) var(--space-4) var(--space-4) var(--space-12);
            border: 2px solid var(--neutral-200);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            transition: all var(--transition-fast);
            background: var(--neutral-50);
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #7c3aed;
            background: white;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }

        .info-note {
            background: var(--info-light);
            color: #1d4ed8;
            padding: var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-5);
            font-size: 0.85rem;
            border-left: 4px solid var(--info);
            display: flex;
            align-items: flex-start;
            gap: var(--space-2);
        }

        .error-message {
            background: var(--error-light);
            color: #b91c1c;
            padding: var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-5);
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid var(--error);
            align-items: center;
            gap: var(--space-2);
        }

        .error-message.show {
            display: flex;
        }

        .btn-login {
            width: 100%;
            padding: var(--space-4);
            background: var(--gradient-hero);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .login-footer {
            padding: var(--space-5) var(--space-8) var(--space-8);
            text-align: center;
            border-top: 1px solid var(--neutral-100);
        }

        .back-link {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: #6d28d9;
        }

        @media (max-width: 480px) {
            .login-wrapper {
                padding: var(--space-4);
            }

            .login-header {
                padding: var(--space-8) var(--space-6);
            }

            .login-form {
                padding: var(--space-6);
            }

            .login-footer {
                padding: var(--space-4) var(--space-6) var(--space-6);
            }

            .login-icon {
                width: 64px;
                height: 64px;
                font-size: 2rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">⚙️</div>
                    <h1>Admin Login</h1>
                    <p>System administration and configuration</p>
                </div>

                <form class="login-form" onsubmit="handleLogin(event)">
                    <div class="info-note">
                        <span>ℹ️</span>
                        <span>Default credentials: <strong>admin</strong> / <strong>admin123</strong></span>
                    </div>

                    <div id="errorMessage" class="error-message">
                        <span>⚠️</span>
                        <span id="errorText">Invalid credentials</span>
                    </div>

                    <div class="form-group">
                        <label>Admin Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="username" required placeholder="Enter admin username" value="admin">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" required placeholder="Enter password">
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <span>🔐</span>
                        <span>Login to Admin Panel</span>
                    </button>
                </form>

                <div class="login-footer">
                    <a href="index.html" class="back-link">
                        <span>←</span>
                        <span>Back to Home</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideError();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('adminSession', JSON.stringify({
                        isLoggedIn: true,
                        loginTime: new Date().toISOString()
                    }));
                    window.location.href = 'admin.html';
                } else {
                    showError('Invalid admin credentials. Please try again.');
                }
            } catch (error) {
                console.error('Login error:', error);

                // Fallback for demo - check hardcoded credentials
                if (username === 'admin' && password === 'admin123') {
                    localStorage.setItem('adminSession', JSON.stringify({
                        isLoggedIn: true,
                        loginTime: new Date().toISOString()
                    }));
                    window.location.href = 'admin.html';
                } else {
                    showError('Server unavailable. Using demo mode - use admin/admin123');
                }
            }
        }
    </script>
</body>

</html>
