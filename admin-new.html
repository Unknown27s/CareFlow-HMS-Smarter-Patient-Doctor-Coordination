<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - CareFlow HMS</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Theme CSS -->
    <link rel="stylesheet" href="styles/theme.css">

    <style>
        body {
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            min-height: 100vh;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-6);
        }

        /* Dashboard Header */
        .admin-header {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-6) var(--space-8);
            box-shadow: var(--shadow-card);
            margin-bottom: var(--space-6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInDown 0.5s ease-out;
        }

        .admin-header-left {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        .admin-icon {
            width: 56px;
            height: 56px;
            background: var(--gradient-hero);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.3);
        }

        .admin-header h1 {
            font-size: 1.5rem;
            color: var(--neutral-800);
        }

        .admin-header p {
            color: var(--neutral-500);
            font-size: 0.9rem;
        }

        .btn-logout {
            background: linear-gradient(135deg, var(--error) 0%, #b91c1c 100%);
            color: white;
            padding: var(--space-3) var(--space-5);
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: var(--space-5);
            margin-bottom: var(--space-6);
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            display: flex;
            align-items: center;
            gap: var(--space-5);
            box-shadow: var(--shadow-card);
            transition: all var(--transition-base);
            animation: fadeInUp 0.5s ease-out backwards;
        }

        .stat-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .stat-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .stat-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
        }

        .stat-icon {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .stat-icon.doctors {
            background: linear-gradient(135deg, rgba(0, 180, 204, 0.15), rgba(0, 151, 167, 0.15));
        }

        .stat-icon.patients {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(4, 120, 87, 0.15));
        }

        .stat-icon.queue {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.15));
        }

        .stat-content h3 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--neutral-800);
            line-height: 1;
            margin-bottom: var(--space-1);
        }

        .stat-content p {
            color: var(--neutral-500);
            font-size: 0.9rem;
        }

        /* Panel Cards */
        .panel {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            box-shadow: var(--shadow-card);
            margin-bottom: var(--space-6);
            animation: fadeInUp 0.5s ease-out backwards;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }

        .panel-icon {
            width: 44px;
            height: 44px;
            background: var(--primary-50);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .panel h2 {
            font-size: 1.25rem;
            color: var(--neutral-800);
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: var(--space-5);
            margin-bottom: var(--space-6);
        }

        .form-group {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--neutral-700);
            margin-bottom: var(--space-2);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border: 2px solid var(--neutral-200);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: all var(--transition-fast);
            background: var(--neutral-50);
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-500);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 180, 204, 0.1);
        }

        .btn-submit {
            background: var(--gradient-hero);
            color: white;
            padding: var(--space-4) var(--space-8);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        /* Messages */
        .message {
            padding: var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-5);
            display: none;
            font-size: 0.9rem;
        }

        .message.success {
            background: var(--success-light);
            color: #047857;
            border-left: 4px solid var(--success);
        }

        .message.error {
            background: var(--error-light);
            color: #b91c1c;
            border-left: 4px solid var(--error);
        }

        .message.show {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        /* Table Styles */
        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-lg);
            border: 1px solid var(--neutral-200);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            background: var(--neutral-800);
            color: white;
            padding: var(--space-4);
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        th:first-child {
            border-radius: var(--radius-md) 0 0 0;
        }

        th:last-child {
            border-radius: 0 var(--radius-md) 0 0;
        }

        td {
            padding: var(--space-4);
            border-bottom: 1px solid var(--neutral-100);
            color: var(--neutral-700);
        }

        tr:hover td {
            background: var(--neutral-50);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--error) 0%, #b91c1c 100%);
            color: white;
            padding: var(--space-2) var(--space-4);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: var(--space-4);
                text-align: center;
            }

            .admin-header-left {
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="cf-header">
        <div class="container">
            <div class="cf-header-inner">
                <a href="index.html" class="cf-logo">
                    <div class="cf-logo-icon">⚕️</div>
                    <div class="cf-logo-text">Care<span>Flow</span></div>
                </a>
                <nav class="cf-nav">
                    <a href="queueTracker.html" class="cf-nav-link">Queue Display</a>
                    <a href="index.html" class="cf-nav-link">Home</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="admin-container">
        <!-- Admin Header -->
        <div class="admin-header">
            <div class="admin-header-left">
                <div class="admin-icon">⚙️</div>
                <div>
                    <h1>Admin Panel</h1>
                    <p>Manage doctors, view statistics, and configure the system</p>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">
                🚪 Logout
            </button>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon doctors">👨‍⚕️</div>
                <div class="stat-content">
                    <h3 id="totalDoctors">0</h3>
                    <p>Total Doctors</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon patients">👥</div>
                <div class="stat-content">
                    <h3 id="totalPatients">0</h3>
                    <p>Total Patients</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon queue">📋</div>
                <div class="stat-content">
                    <h3 id="todayQueue">0</h3>
                    <p>Today's Queue</p>
                </div>
            </div>
        </div>

        <!-- Add Doctor Panel -->
        <div class="panel" style="animation-delay: 0.4s;">
            <div class="panel-header">
                <div class="panel-icon">👨‍⚕️</div>
                <h2>Add New Doctor</h2>
            </div>

            <div id="message" class="message"></div>

            <form id="addDoctorForm" onsubmit="addDoctor(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Doctor Name *</label>
                        <input type="text" id="doctorName" required placeholder="Dr. John Smith">
                    </div>
                    <div class="form-group">
                        <label>Doctor ID/Username *</label>
                        <input type="text" id="doctorId" required placeholder="DOC001">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" id="doctorPassword" required placeholder="Enter password">
                    </div>
                    <div class="form-group">
                        <label>Department *</label>
                        <select id="doctorDepartment" required>
                            <option value="">Select Department</option>
                            <option value="General">General Medicine</option>
                            <option value="ENT">ENT</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Ophthalmology">Ophthalmology</option>
                            <option value="Gynecology">Gynecology</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    ➕ Add Doctor
                </button>
            </form>
        </div>

        <!-- Doctors List -->
        <div class="panel" style="animation-delay: 0.5s;">
            <div class="panel-header">
                <div class="panel-icon">👥</div>
                <h2>Registered Doctors</h2>
            </div>

            <div class="table-container">
                <table id="doctorsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="doctorsTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px;">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Check admin authentication
        function checkAdminAuth() {
            const adminSession = localStorage.getItem('adminSession');
            if (!adminSession) {
                window.location.href = 'adminLogin.html';
                return false;
            }
            return true;
        }

        if (!checkAdminAuth()) {
            // Will redirect
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('adminSession');
                window.location.href = 'adminLogin.html';
            }
        }

        async function addDoctor(event) {
            event.preventDefault();

            const name = document.getElementById('doctorName').value;
            const username = document.getElementById('doctorId').value;
            const password = document.getElementById('doctorPassword').value;
            const department = document.getElementById('doctorDepartment').value;

            try {
                const response = await fetch('http://localhost:3000/api/admin/doctors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        name,
                        department,
                        role: 'doctor'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✓ Doctor added successfully!', 'success');
                    document.getElementById('addDoctorForm').reset();
                    loadDoctors();
                    loadStatistics();
                } else {
                    showMessage('✗ ' + (data.error || 'Failed to add doctor'), 'error');
                }
            } catch (error) {
                console.error('Error adding doctor:', error);
                showMessage('✗ Failed to add doctor. Please make sure the server is running.', 'error');
            }
        }

        async function loadDoctors() {
            try {
                const response = await fetch('http://localhost:3000/api/admin/doctors');
                const data = await response.json();

                const tbody = document.getElementById('doctorsTableBody');

                if (data.success && data.doctors.length > 0) {
                    tbody.innerHTML = data.doctors.map(doctor => `
                        <tr>
                            <td><code style="background: var(--neutral-100); padding: 2px 8px; border-radius: 4px;">${doctor.username}</code></td>
                            <td><strong>${doctor.name}</strong></td>
                            <td>
                                <span style="background: var(--primary-50); color: var(--primary-700); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;">
                                    ${doctor.department}
                                </span>
                            </td>
                            <td>${new Date(doctor.created_at).toLocaleDateString()}</td>
                            <td>
                                <button class="btn-danger" onclick="deleteDoctor(${doctor.id}, '${doctor.username}')">
                                    🗑️ Delete
                                </button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px; color: var(--neutral-400);">
                                No doctors registered yet
                            </td>
                        </tr>
                    `;
                }
            } catch (error) {
                console.error('Error loading doctors:', error);
            }
        }

        async function deleteDoctor(id, username) {
            if (!confirm(`Are you sure you want to delete doctor: ${username}?`)) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:3000/api/admin/doctors/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✓ Doctor deleted successfully!', 'success');
                    loadDoctors();
                    loadStatistics();
                } else {
                    showMessage('✗ ' + (data.error || 'Failed to delete doctor'), 'error');
                }
            } catch (error) {
                console.error('Error deleting doctor:', error);
                showMessage('✗ Failed to delete doctor', 'error');
            }
        }

        async function loadStatistics() {
            try {
                const response = await fetch('http://localhost:3000/api/stats');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('totalDoctors').textContent = data.stats.totalDoctors || 0;
                    document.getElementById('totalPatients').textContent = data.stats.totalPatients || 0;
                    document.getElementById('todayQueue').textContent = data.stats.today.total || 0;
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;

            setTimeout(() => {
                messageEl.className = 'message';
            }, 5000);
        }

        window.onload = function () {
            loadDoctors();
            loadStatistics();
        };
    </script>
</body>

</html>
