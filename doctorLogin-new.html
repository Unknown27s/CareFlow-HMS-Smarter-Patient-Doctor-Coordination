<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - CareFlow HMS</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Theme CSS -->
    <link rel="stylesheet" href="styles/theme.css">

    <style>
        body {
            background: linear-gradient(135deg, #e6f7f9 0%, #f0f9ff 50%, #f5f3ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Language Toggle */
        .language-toggle {
            position: fixed;
            top: var(--space-5);
            right: var(--space-5);
            z-index: 1000;
        }

        .lang-btn {
            background: white;
            color: var(--primary-600);
            padding: var(--space-2) var(--space-4);
            border: 2px solid var(--primary-200);
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            box-shadow: var(--shadow-md);
        }

        .lang-btn:hover {
            background: var(--primary-50);
            border-color: var(--primary-400);
        }

        /* Main Content */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.6s ease-out;
        }

        .login-card {
            background: white;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            overflow: hidden;
        }

        /* Login Header */
        .login-header {
            background: var(--gradient-primary);
            padding: var(--space-10) var(--space-8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: float 6s ease-in-out infinite;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto var(--space-5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            position: relative;
            animation: bounce 3s ease-in-out infinite;
        }

        .login-header h1 {
            color: white;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: var(--space-2);
            position: relative;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            position: relative;
        }

        /* Login Form */
        .login-form {
            padding: var(--space-8);
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--neutral-700);
            margin-bottom: var(--space-2);
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: var(--space-4);
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--neutral-400);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: var(--space-4) var(--space-4) var(--space-4) var(--space-12);
            border: 2px solid var(--neutral-200);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            transition: all var(--transition-fast);
            background: var(--neutral-50);
            font-family: inherit;
        }

        .form-group select {
            padding-left: var(--space-12);
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 16px center;
            background-repeat: no-repeat;
            background-size: 20px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-500);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 180, 204, 0.1);
        }

        .form-group input::placeholder {
            color: var(--neutral-400);
        }

        /* Error Message */
        .error-message {
            background: var(--error-light);
            color: #b91c1c;
            padding: var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-5);
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid var(--error);
            align-items: center;
            gap: var(--space-2);
        }

        .error-message.show {
            display: flex;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: var(--space-4);
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 4px 14px rgba(0, 180, 204, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 180, 204, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Login Footer */
        .login-footer {
            padding: var(--space-5) var(--space-8) var(--space-8);
            text-align: center;
            border-top: 1px solid var(--neutral-100);
        }

        .back-link {
            color: var(--primary-600);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--primary-700);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-wrapper {
                padding: var(--space-4);
            }

            .login-header {
                padding: var(--space-8) var(--space-6);
            }

            .login-form {
                padding: var(--space-6);
            }

            .login-footer {
                padding: var(--space-4) var(--space-6) var(--space-6);
            }

            .login-icon {
                width: 64px;
                height: 64px;
                font-size: 2rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Language Toggle -->
    <div class="language-toggle">
        <button class="lang-btn" onclick="toggleLanguage()">
            <span>🌐</span>
            <span id="langBtnText">தமிழ்</span>
        </button>
    </div>

    <!-- Login Form -->
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">🩺</div>
                    <h1 id="loginTitle">Doctor Login</h1>
                    <p id="loginSubtitle">Access your dashboard to manage patients</p>
                </div>

                <form class="login-form" onsubmit="handleLogin(event)">
                    <div id="errorMessage" class="error-message">
                        <span>⚠️</span>
                        <span id="errorText">Invalid credentials</span>
                    </div>

                    <div class="form-group">
                        <label id="userIdLabel">Doctor ID / Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="username" required placeholder="Enter your Doctor ID">
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="passwordLabel">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" required placeholder="Enter your password">
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="departmentLabel">Department</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🏥</span>
                            <select id="department" required>
                                <option value="">Select Department</option>
                                <option value="General">General Medicine</option>
                                <option value="ENT">ENT</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Orthopedics">Orthopedics</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Dermatology">Dermatology</option>
                                <option value="Neurology">Neurology</option>
                                <option value="Ophthalmology">Ophthalmology</option>
                                <option value="Gynecology">Gynecology</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">
                        <span>🔐</span>
                        <span id="loginBtnText">Login to Dashboard</span>
                    </button>
                </form>

                <div class="login-footer">
                    <a href="index.html" class="back-link" id="backLink">
                        <span>←</span>
                        <span id="backLinkText">Back to Home</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Language translations
        const translations = {
            en: {
                langBtn: 'தமிழ்',
                loginTitle: 'Doctor Login',
                loginSubtitle: 'Access your dashboard to manage patients',
                userIdLabel: 'Doctor ID / Username',
                passwordLabel: 'Password',
                departmentLabel: 'Department',
                loginBtnText: 'Login to Dashboard',
                backLinkText: 'Back to Home',
                invalidCredentials: 'Invalid credentials. Please try again.',
                serverError: 'Server error. Please make sure the server is running.',
                selectDepartment: 'Select Department'
            },
            ta: {
                langBtn: 'English',
                loginTitle: 'மருத்துவர் உள்நுழைவு',
                loginSubtitle: 'நோயாளிகளை நிர்வகிக்க உங்கள் டாஷ்போர்டை அணுகவும்',
                userIdLabel: 'மருத்துவர் ஐடி',
                passwordLabel: 'கடவுச்சொல்',
                departmentLabel: 'துறை',
                loginBtnText: 'உள்நுழைக',
                backLinkText: 'முகப்புக்குத் திரும்பு',
                invalidCredentials: 'தவறான சான்றுகள். மீண்டும் முயற்சிக்கவும்.',
                serverError: 'சர்வர் பிழை. சர்வர் இயங்குகிறதா என்று சரிபார்க்கவும்.',
                selectDepartment: 'துறையைத் தேர்ந்தெடுக்கவும்'
            }
        };

        let currentLang = localStorage.getItem('preferredLanguage') || 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ta' : 'en';
            localStorage.setItem('preferredLanguage', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            const t = translations[currentLang];
            document.getElementById('langBtnText').textContent = t.langBtn;
            document.getElementById('loginTitle').textContent = t.loginTitle;
            document.getElementById('loginSubtitle').textContent = t.loginSubtitle;
            document.getElementById('userIdLabel').textContent = t.userIdLabel;
            document.getElementById('passwordLabel').textContent = t.passwordLabel;
            document.getElementById('departmentLabel').textContent = t.departmentLabel;
            document.getElementById('loginBtnText').textContent = t.loginBtnText;
            document.getElementById('backLinkText').textContent = t.backLinkText;
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideError();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const department = document.getElementById('department').value;

            const t = translations[currentLang];

            try {
                const response = await fetch('http://localhost:3000/api/doctor/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginInput: username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Store session
                    localStorage.setItem('doctorSession', JSON.stringify({
                        isLoggedIn: true,
                        doctorId: data.user.id,
                        username: data.user.username,
                        name: data.user.name,
                        department: department || data.user.department,
                        loginTime: new Date().toISOString()
                    }));

                    // Redirect to dashboard
                    window.location.href = 'doctor.html';
                } else {
                    showError(t.invalidCredentials);
                }
            } catch (error) {
                console.error('Login error:', error);
                showError(t.serverError);
            }
        }

        // Initialize
        applyLanguage();
    </script>
</body>

</html>
