<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Tracker - Real-time Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .refresh-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .refresh-icon {
            font-size: 1.2em;
            transition: transform 0.5s ease;
        }

        .refresh-btn.loading .refresh-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.3s ease;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .stat-card h3 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card p {
            color: #666;
            font-size: 1em;
            font-weight: 600;
        }

        .stat-card.waiting h3 {
            background: linear-gradient(135deg, #ff9800 0%, #ff5722 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card.in-progress h3 {
            background: linear-gradient(135deg, #2196f3 0%, #03a9f4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card.completed h3 {
            background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Department Tabs */
        .department-tabs {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dept-tab {
            padding: 12px 24px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            background: white;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dept-tab:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }

        .dept-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        /* Queue Display */
        .queue-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .queue-section h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .queue-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .queue-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .queue-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .queue-card.waiting {
            border-left-color: #ff9800;
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
        }

        .queue-card.in-progress {
            border-left-color: #2196f3;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }

        .queue-card.completed {
            border-left-color: #4caf50;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            opacity: 0.7;
        }

        .queue-token {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .queue-info {
            margin-bottom: 10px;
        }

        .queue-info h4 {
            color: #333;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .queue-info p {
            color: #666;
            font-size: 0.9em;
            margin: 3px 0;
        }

        .queue-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 10px;
        }

        .queue-status.waiting {
            background: #ff9800;
            color: white;
        }

        .queue-status.in-progress {
            background: #2196f3;
            color: white;
        }

        .queue-status.completed {
            background: #4caf50;
            color: white;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        /* Last Updated */
        .last-updated {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            color: #666;
            font-size: 0.95em;
        }

        .last-updated strong {
            color: #667eea;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .queue-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Auto-refresh indicator */
        .auto-refresh-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
        }

        .refresh-dot {
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <span>📊</span>
                Real-time Queue Tracker
            </h1>
            <button class="refresh-btn" onclick="refreshQueue()">
                <span class="refresh-icon">🔄</span>
                <span id="refreshText">Refresh Now</span>
            </button>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalPatients">0</h3>
                <p>Total Today</p>
            </div>
            <div class="stat-card waiting">
                <h3 id="waitingCount">0</h3>
                <p>Waiting</p>
            </div>
            <div class="stat-card in-progress">
                <h3 id="inProgressCount">0</h3>
                <p>In Progress</p>
            </div>
            <div class="stat-card completed">
                <h3 id="completedCount">0</h3>
                <p>Completed</p>
            </div>
        </div>

        <!-- Department Tabs -->
        <div class="department-tabs" id="departmentTabs">
            <div class="dept-tab active" data-dept="ALL" onclick="filterByDepartment('ALL')">
                All Departments
            </div>
            <div class="dept-tab" data-dept="GEN" onclick="filterByDepartment('GEN')">
                General Medicine
            </div>
            <div class="dept-tab" data-dept="ENT" onclick="filterByDepartment('ENT')">
                ENT
            </div>
            <div class="dept-tab" data-dept="CAR" onclick="filterByDepartment('CAR')">
                Cardiology
            </div>
            <div class="dept-tab" data-dept="ORT" onclick="filterByDepartment('ORT')">
                Orthopedics
            </div>
            <div class="dept-tab" data-dept="PED" onclick="filterByDepartment('PED')">
                Pediatrics
            </div>
            <div class="dept-tab" data-dept="DER" onclick="filterByDepartment('DER')">
                Dermatology
            </div>
            <div class="dept-tab" data-dept="NEU" onclick="filterByDepartment('NEU')">
                Neurology
            </div>
        </div>

        <!-- Queue Display -->
        <div class="queue-section">
            <h2>
                <span>👥</span>
                Queue Status (<span id="queueCount">0</span> patients)
            </h2>
            <div id="queueGrid" class="queue-grid">
                <!-- Queue cards will be inserted here -->
            </div>
        </div>

        <!-- Last Updated -->
        <div class="last-updated">
            Last updated: <strong id="lastUpdated">Never</strong>
        </div>

        <!-- Auto-refresh Indicator -->
        <div class="auto-refresh-indicator">
            <div class="refresh-dot"></div>
            <span>Auto-updating every 5s</span>
        </div>
    </div>

    <script>
        let currentDepartment = 'ALL';
        let allQueueData = [];
        let ws = null;
        let autoRefreshInterval = null;

        // Connect to WebSocket for real-time updates
        function connectWebSocket() {
            try {
                ws = new WebSocket('ws://localhost:3000');

                ws.onopen = () => {
                    console.log('WebSocket connected');
                };

                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);

                        if (message.type === 'INITIAL_QUEUE' ||
                            message.type === 'NEW_REGISTRATION' ||
                            message.type === 'STATUS_UPDATE') {
                            console.log('Received update:', message.type);
                            refreshQueue();
                        }
                    } catch (error) {
                        console.error('Error processing WebSocket message:', error);
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected. Reconnecting in 5s...');
                    setTimeout(connectWebSocket, 5000);
                };
            } catch (error) {
                console.error('Failed to connect to WebSocket:', error);
                setTimeout(connectWebSocket, 5000);
            }
        }

        // Refresh queue data
        async function refreshQueue() {
            const refreshBtn = document.querySelector('.refresh-btn');
            const refreshIcon = document.querySelector('.refresh-icon');
            const refreshText = document.getElementById('refreshText');

            // Show loading state
            refreshBtn.classList.add('loading');
            refreshText.textContent = 'Refreshing...';

            try {
                const response = await fetch('http://localhost:3000/api/queue');
                const data = await response.json();

                if (data.success) {
                    allQueueData = data.queue || [];
                    updateStatistics();
                    displayQueue();
                    updateLastUpdated();
                }
            } catch (error) {
                console.error('Error fetching queue:', error);
                showError('Failed to fetch queue data. Please check if server is running.');
            } finally {
                // Remove loading state
                refreshBtn.classList.remove('loading');
                refreshText.textContent = 'Refresh Now';
            }
        }

        // Update statistics
        function updateStatistics() {
            const today = new Date().toDateString();
            const todayQueue = allQueueData.filter(p => {
                const regDate = new Date(p.registered_at).toDateString();
                return regDate === today;
            });

            const waiting = todayQueue.filter(p => p.status === 'Waiting').length;
            const inProgress = todayQueue.filter(p => p.status === 'In Progress').length;
            const completed = todayQueue.filter(p => p.status === 'Completed').length;

            document.getElementById('totalPatients').textContent = todayQueue.length;
            document.getElementById('waitingCount').textContent = waiting;
            document.getElementById('inProgressCount').textContent = inProgress;
            document.getElementById('completedCount').textContent = completed;
        }

        // Display queue based on current filter
        function displayQueue() {
            const queueGrid = document.getElementById('queueGrid');

            let filteredQueue = allQueueData;

            // Filter by department if not ALL
            if (currentDepartment !== 'ALL') {
                filteredQueue = allQueueData.filter(p => p.department === currentDepartment);
            }

            // Filter only today's queue
            const today = new Date().toDateString();
            filteredQueue = filteredQueue.filter(p => {
                const regDate = new Date(p.registered_at).toDateString();
                return regDate === today;
            });

            // Sort by registration time
            filteredQueue.sort((a, b) => new Date(a.registered_at) - new Date(b.registered_at));

            // Update queue count
            document.getElementById('queueCount').textContent = filteredQueue.length;

            // Display queue cards
            if (filteredQueue.length === 0) {
                queueGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">📋</div>
                        <h3>No Patients in Queue</h3>
                        <p>No patients found for the selected department</p>
                    </div>
                `;
                return;
            }

            queueGrid.innerHTML = filteredQueue.map(patient => {
                const statusClass = patient.status.toLowerCase().replace(' ', '-');
                const waitTime = getWaitTime(patient.registered_at);

                return `
                    <div class="queue-card ${statusClass}">
                        <div class="queue-token">${patient.token}</div>
                        <div class="queue-info">
                            <h4>${patient.name}</h4>
                            <p>👤 Age: ${patient.age} • ${patient.gender}</p>
                            <p>📞 ${patient.contact}</p>
                            <p>🏥 Department: ${getDepartmentName(patient.department)}</p>
                            <p>🕒 ${waitTime}</p>
                            ${patient.symptoms ? `<p>💬 ${patient.symptoms}</p>` : ''}
                        </div>
                        <span class="queue-status ${statusClass}">${patient.status}</span>
                    </div>
                `;
            }).join('');
        }

        // Filter by department
        function filterByDepartment(dept) {
            currentDepartment = dept;

            // Update active tab
            document.querySelectorAll('.dept-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.getAttribute('data-dept') === dept) {
                    tab.classList.add('active');
                }
            });

            displayQueue();
        }

        // Get department full name
        function getDepartmentName(code) {
            const departments = {
                'GEN': 'General Medicine',
                'ENT': 'ENT',
                'CAR': 'Cardiology',
                'ORT': 'Orthopedics',
                'PED': 'Pediatrics',
                'DER': 'Dermatology',
                'NEU': 'Neurology'
            };
            return departments[code] || code;
        }

        // Get wait time
        function getWaitTime(registeredAt) {
            const now = new Date();
            const registered = new Date(registeredAt);
            const diffMs = now - registered;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min ago`;
            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            return `${hours}h ${mins}m ago`;
        }

        // Update last updated time
        function updateLastUpdated() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            document.getElementById('lastUpdated').textContent = timeStr;
        }

        // Show error message
        function showError(message) {
            alert(message);
        }

        // Auto-refresh every 5 seconds
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                refreshQueue();
            }, 5000);
        }

        // Initialize on load
        window.onload = function () {
            connectWebSocket();
            refreshQueue();
            startAutoRefresh();
        };

        // Cleanup on unload
        window.onbeforeunload = function () {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            if (ws) {
                ws.close();
            }
        };
    </script>
</body>

</html>
