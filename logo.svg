<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    
    <!-- Gradient for glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Inner decorative ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Hospital Cross -->
  <g filter="url(#glow)">
    <!-- Vertical bar of cross -->
    <rect x="170" y="80" width="60" height="160" rx="12" fill="white"/>
    <!-- Horizontal bar of cross -->
    <rect x="120" y="130" width="160" height="60" rx="12" fill="white"/>
  </g>
  
  <!-- Heartbeat line -->
  <g filter="url(#glow)">
    <polyline 
      points="80,260 130,260 150,260 170,220 190,300 210,240 230,260 270,260 320,260" 
      fill="none" 
      stroke="white" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round"/>
  </g>
  
  <!-- Small decorative circles -->
  <circle cx="80" cy="260" r="8" fill="white" opacity="0.8"/>
  <circle cx="320" cy="260" r="8" fill="white" opacity="0.8"/>
  
  <!-- Text: CF -->
  <text x="200" y="340" 
        font-family="Arial, sans-serif" 
        font-size="36" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle"
        opacity="0.9">
    CareFlow
  </text>
</svg>
