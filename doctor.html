<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - மருத்துவர் பலகை</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f1f8e9 100%);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Language Toggle Button */
        .language-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .lang-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .lang-icon {
            font-size: 1.2em;
        }

        /* Header Section */
        .header-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .doctor-info h1 {
            color: #1976d2;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .doctor-info p {
            color: #666;
            font-size: 1.1em;
        }

        .doctor-name {
            color: #1976d2;
            font-weight: 700;
            font-size: 1.2em;
        }

        .logout-btn {
            background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
        }

        .header-stats {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1976d2 0%, #2196f3 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            text-align: center;
            min-width: 120px;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* Department Filter */
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-section label {
            font-weight: 600;
            color: #555;
        }

        .filter-section select {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .filter-section select:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        /* Current Patient Section */
        .current-patient-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .current-patient-section h2 {
            color: #1976d2;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .patient-card {
            background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .patient-card.empty {
            background: #f5f5f5;
            color: #999;
            text-align: center;
            padding: 40px;
        }

        .patient-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .patient-detail {
            display: flex;
            flex-direction: column;
        }

        .patient-detail label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .patient-detail span {
            font-size: 1.1em;
            font-weight: 600;
        }

        .patient-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-action {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-complete {
            background: white;
            color: #4caf50;
        }

        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
        }

        .btn-skip {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-skip:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Queue Section */
        .queue-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .queue-section h2 {
            color: #1976d2;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .queue-item {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .queue-item:hover {
            background: #e8f5e9;
            transform: translateX(5px);
        }

        .queue-item-info {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1;
        }

        .queue-token {
            background: linear-gradient(135deg, #1976d2 0%, #2196f3 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            min-width: 100px;
            text-align: center;
        }

        .queue-patient-info {
            flex: 1;
        }

        .queue-patient-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .queue-patient-info p {
            color: #666;
            font-size: 0.9em;
        }

        .queue-time {
            color: #999;
            font-size: 0.9em;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        /* Stats Cards */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            font-size: 3em;
        }

        .stat-content h3 {
            font-size: 2em;
            color: #1976d2;
            margin-bottom: 5px;
        }

        .stat-content p {
            color: #666;
            font-size: 0.9em;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .header-stats {
                width: 100%;
                justify-content: center;
            }

            .patient-details {
                grid-template-columns: 1fr;
            }

            .queue-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .queue-item-info {
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
            }
        }

        /* Auto-refresh indicator */
        .refresh-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
        }

        .refresh-dot {
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <!-- Language Toggle Button -->
    <div class="language-toggle">
        <button class="lang-btn" onclick="toggleLanguage()">
            <span class="lang-icon">🌐</span>
            <span id="langBtnText">தமிழ்</span>
        </button>
    </div>

    <div class="container">
        <!-- Header Section -->
        <section class="header-section">
            <div class="header-content">
                <div class="doctor-info">
                    <h1 id="dashboardTitle">👨‍⚕️ Doctor Dashboard</h1>
                    <p>Welcome, <span id="doctorName" class="doctor-name">Doctor</span></p>
                    <p style="font-size: 0.9em; color: #888; margin-top: 5px;">
                        <span id="doctorDepartment"></span>
                    </p>
                    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
                </div>
                <div class="header-stats">
                    <div class="stat-card">
                        <h3 id="totalToday">0</h3>
                        <p id="totalTodayLabel">Today</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="completedToday">0</h3>
                        <p id="completedTodayLabel">Completed</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Current Patient Section -->
        <section class="current-patient-section">
            <h2 id="currentPatientTitle">Current Patient</h2>
            <div id="currentPatientCard"></div>
        </section>

        <!-- Queue Section -->
        <section class="queue-section">
            <h2 id="queueTitle">Waiting Queue (<span id="queueCount">0</span>)</h2>
            <div id="queueList" class="queue-list"></div>
        </section>

        <!-- Auto-refresh Indicator -->
        <div class="refresh-indicator">
            <div class="refresh-dot"></div>
            <span id="refreshText">Auto-refreshing</span>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // SESSION AUTHENTICATION CHECK
        // ═══════════════════════════════════════════════════════════════

        // Check if doctor is logged in
        function checkAuthentication() {
            const session = localStorage.getItem('doctorSession');

            if (!session) {
                // Redirect to login if not authenticated
                alert('Please login first!');
                window.location.href = 'doctor-login.html';
                return null;
            }

            const doctorSession = JSON.parse(session);

            if (!doctorSession.isLoggedIn) {
                alert('Session expired. Please login again!');
                window.location.href = 'doctor-login.html';
                return null;
            }

            return doctorSession;
        }

        // Get logged in doctor's info
        const doctorSession = checkAuthentication();

        // If authentication failed, stop execution
        if (!doctorSession) {
            throw new Error('Not authenticated');
        }

        // Language translations
        const translations = {
            en: {
                langBtn: 'தமிழ்',
                dashboardTitle: '👨‍⚕️ Doctor Dashboard',
                welcomeText: 'Welcome, Dr. Smith',
                totalTodayLabel: 'Today',
                completedTodayLabel: 'Completed',
                currentPatientTitle: 'Current Patient',
                queueTitle: 'Waiting Queue',
                refreshText: 'Auto-refreshing',
                noPatient: 'No patient currently being consulted',
                callNext: 'Call next patient to begin consultation',
                tokenLabel: 'Token',
                nameLabel: 'Name',
                ageLabel: 'Age',
                genderLabel: 'Gender',
                contactLabel: 'Contact',
                symptomsLabel: 'Symptoms',
                completeBtn: 'Complete Consultation',
                skipBtn: 'Skip Patient',
                waitingSince: 'Waiting since',
                emptyQueue: 'No patients in queue',
                allCaughtUp: 'All caught up! No waiting patients.',
                visitTypeLabel: 'Visit Type'
            },
            ta: {
                langBtn: 'English',
                dashboardTitle: '👨‍⚕️ மருத்துவர் பலகை',
                welcomeText: 'வரவேற்கிறோம், டாக்டர். ஸ்மித்',
                totalTodayLabel: 'இன்று',
                completedTodayLabel: 'முடிந்தது',
                currentPatientTitle: 'தற்போதைய நோயாளி',
                queueTitle: 'காத்திருப்பு வரிசை',
                refreshText: 'தானாக புதுப்பிக்கப்படுகிறது',
                noPatient: 'தற்போது எந்த நோயாளியும் ஆலோசனையில் இல்லை',
                callNext: 'ஆலோசனையைத் தொடங்க அடுத்த நோயாளியை அழைக்கவும்',
                tokenLabel: 'டோக்கன்',
                nameLabel: 'பெயர்',
                ageLabel: 'வயது',
                genderLabel: 'பாலினம்',
                contactLabel: 'தொலைபேசி',
                symptomsLabel: 'அறிகுறிகள்',
                completeBtn: 'ஆலோசனையை முடிக்கவும்',
                skipBtn: 'நோயாளியைத் தவிர்க்கவும்',
                waitingSince: 'காத்திருப்பு நேரம்',
                emptyQueue: 'வரிசையில் நோயாளிகள் இல்லை',
                allCaughtUp: 'அனைத்தும் முடிந்தது! காத்திருக்கும் நோயாளிகள் இல்லை.',
                visitTypeLabel: 'வருகை வகை'
            }
        };

        let currentLang = 'en';
        let currentPatient = null;
        let refreshInterval = null;
        let ws = null; // WebSocket connection

        // Connect to WebSocket server for real-time updates
        function connectWebSocket() {
            try {
                ws = new WebSocket('ws://localhost:3000');

                ws.onopen = () => {
                    console.log('WebSocket connected');
                };

                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);

                        if (message.type === 'INITIAL_QUEUE') {
                            // Load initial queue data
                            console.log('Received initial queue:', message.data);
                            refresh();
                        } else if (message.type === 'NEW_REGISTRATION') {
                            // New patient registered - refresh the queue
                            console.log('New patient registered:', message.data);
                            refresh();
                        } else if (message.type === 'STATUS_UPDATE') {
                            // Patient status updated
                            console.log('Status updated:', message.data);
                            refresh();
                        }
                    } catch (error) {
                        console.error('Error processing WebSocket message:', error);
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected. Reconnecting in 5s...');
                    setTimeout(connectWebSocket, 5000);
                };
            } catch (error) {
                console.error('Failed to connect to WebSocket:', error);
                setTimeout(connectWebSocket, 5000);
            }
        }

        // Initialize language
        function initializeLanguage() {
            const savedLang = localStorage.getItem('preferredLanguage');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
                applyLanguage(currentLang);
            } else {
                // Apply default language and update doctor info
                applyLanguage(currentLang);
            }
        }

        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ta' : 'en';
            localStorage.setItem('preferredLanguage', currentLang);
            applyLanguage(currentLang);
        }

        // Apply language
        function applyLanguage(lang) {
            const t = translations[lang];
            document.getElementById('langBtnText').textContent = t.langBtn;
            document.getElementById('dashboardTitle').textContent = t.dashboardTitle;

            // Update welcome text with doctor's name
            const doctorNameEl = document.getElementById('doctorName');
            if (doctorSession) {
                doctorNameEl.textContent = `Dr. ${doctorSession.name}`;
                const deptEl = document.getElementById('doctorDepartment');
                if (doctorSession.department) {
                    deptEl.textContent = `Department: ${doctorSession.department}`;
                }
            }

            document.getElementById('totalTodayLabel').textContent = t.totalTodayLabel;
            document.getElementById('completedTodayLabel').textContent = t.completedTodayLabel;
            document.getElementById('currentPatientTitle').textContent = t.currentPatientTitle;
            document.getElementById('queueTitle').innerHTML = `${t.queueTitle} (<span id="queueCount">0</span>)`;
            document.getElementById('refreshText').textContent = t.refreshText;

            // Refresh displays
            displayCurrentPatient();
            displayQueue();
        }

        // Get queue from server
        async function getQueue() {
            try {
                const response = await fetch('http://localhost:3000/api/queue');
                const data = await response.json();

                if (data.success) {
                    return data.queue || [];
                }
                return [];
            } catch (error) {
                console.error('Error fetching queue:', error);
                return [];
            }
        }

        // Save queue status update to server
        async function saveQueueStatus(queueId, status) {
            try {
                const response = await fetch(`http://localhost:3000/api/queue/${queueId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });

                return await response.json();
            } catch (error) {
                console.error('Error updating queue status:', error);
                return { success: false };
            }
        }

        // Get all waiting patients (no department filtering)
        async function getFilteredQueue() {
            const queue = await getQueue();
            const waiting = queue.filter(p => p.status === 'Waiting');
            return waiting;
        }

        // Get next patient
        async function getNextPatient() {
            const filteredQueue = await getFilteredQueue();
            return filteredQueue.length > 0 ? filteredQueue[0] : null;
        }

        // Display current patient
        function displayCurrentPatient() {
            const t = translations[currentLang];
            const container = document.getElementById('currentPatientCard');

            if (!currentPatient) {
                container.innerHTML = `
                    <div class="patient-card empty">
                        <div class="empty-state-icon">👤</div>
                        <h3>${t.noPatient}</h3>
                        <p>${t.callNext}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="patient-card">
                    <div class="patient-details">
                        <div class="patient-detail">
                            <label>${t.tokenLabel}</label>
                            <span>${currentPatient.token}</span>
                        </div>
                        <div class="patient-detail">
                            <label>${t.nameLabel}</label>
                            <span>${currentPatient.name}</span>
                        </div>
                        <div class="patient-detail">
                            <label>${t.ageLabel}</label>
                            <span>${currentPatient.age}</span>
                        </div>
                        <div class="patient-detail">
                            <label>${t.genderLabel}</label>
                            <span>${currentPatient.gender}</span>
                        </div>
                        <div class="patient-detail">
                            <label>${t.contactLabel}</label>
                            <span>${currentPatient.contact}</span>
                        </div>
                        <div class="patient-detail">
                            <label>Visit Count</label>
                            <span>${currentPatient.visit_count || 1}</span>
                        </div>
                    </div>
                    <div class="patient-detail" style="grid-column: 1/-1;">
                        <label>${t.symptomsLabel}</label>
                        <span>${currentPatient.symptoms || 'No symptoms recorded'}</span>
                    </div>
                    <div class="patient-actions">
                        <button class="btn-action btn-complete" onclick="completeConsultation()">
                            ${t.completeBtn}
                        </button>
                        <button class="btn-action btn-skip" onclick="skipPatient()">
                            ${t.skipBtn}
                        </button>
                    </div>
                </div>
            `;
        }

        // Display queue
        async function displayQueue() {
            const t = translations[currentLang];
            const filteredQueue = await getFilteredQueue();
            const container = document.getElementById('queueList');
            const countEl = document.getElementById('queueCount');

            // Skip first patient if there's a current patient
            const displayQueueList = currentPatient ? filteredQueue.slice(1) : filteredQueue;

            countEl.textContent = displayQueueList.length;

            if (displayQueueList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <h3>${t.emptyQueue}</h3>
                        <p>${t.allCaughtUp}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = displayQueueList.map(patient => {
                const waitTime = getWaitTime(patient.registered_at);
                return `
                    <div class="queue-item">
                        <div class="queue-item-info">
                            <div class="queue-token">${patient.token}</div>
                            <div class="queue-patient-info">
                                <h4>${patient.name}</h4>
                                <p>${patient.age} years • ${patient.gender} • ${(patient.symptoms || '').substring(0, 50)}${(patient.symptoms || '').length > 50 ? '...' : ''}</p>
                            </div>
                        </div>
                        <div class="queue-time">
                            ${t.waitingSince} ${waitTime}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Get wait time
        function getWaitTime(registeredAt) {
            const now = new Date();
            const registered = new Date(registeredAt);
            const diffMs = now - registered;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min`;
            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            return `${hours}h ${mins}m`;
        }

        // Update statistics
        async function updateStats() {
            const queue = await getQueue();
            const today = new Date().toDateString();

            const todayPatients = queue.filter(p => {
                const regDate = new Date(p.registered_at).toDateString();
                return regDate === today;
            });

            const completed = todayPatients.filter(p => p.status === 'Completed');

            document.getElementById('totalToday').textContent = todayPatients.length;
            document.getElementById('completedToday').textContent = completed.length;
        }

        // Call next patient
        async function callNextPatient() {
            if (!currentPatient) {
                const next = await getNextPatient();
                if (next) {
                    currentPatient = next;
                    displayCurrentPatient();
                }
            }
        }

        // Complete consultation
        async function completeConsultation() {
            if (!currentPatient) return;

            // Update status on server
            await saveQueueStatus(currentPatient.queue_id, 'Completed');

            currentPatient = null;
            await refresh();
            await callNextPatient();
        }

        // Skip patient
        async function skipPatient() {
            if (!currentPatient) return;

            // Update status on server
            await saveQueueStatus(currentPatient.queue_id, 'Skipped');

            currentPatient = null;
            await refresh();
            await callNextPatient();
        }

        // Refresh display
        async function refresh() {
            await updateStats();
            displayCurrentPatient();
            await displayQueue();
        }

        // Auto-refresh every 3 seconds
        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                refresh();
                if (!currentPatient) {
                    callNextPatient();
                }
            }, 3000);
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('doctorSession');
                window.location.href = 'doctorLogin.html';
            }
        }

        // Initialize on load
        window.onload = async function () {
            initializeLanguage();
            connectWebSocket(); // Connect to real-time updates
            await refresh();
            await callNextPatient();
            startAutoRefresh();
        };

        // Cleanup on unload
        window.onbeforeunload = function () {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            if (ws) {
                ws.close();
            }
        };
    </script>
</body>

</html>
