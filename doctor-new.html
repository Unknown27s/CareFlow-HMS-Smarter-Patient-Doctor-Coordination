<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - CareFlow HMS</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Theme CSS -->
    <link rel="stylesheet" href="styles/theme.css">

    <style>
        /* Page-specific styles for doctor.html */
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f9 100%);
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-6);
        }

        /* Language Toggle */
        .language-toggle {
            position: fixed;
            top: 90px;
            right: var(--space-6);
            z-index: 999;
        }

        .lang-btn {
            background: white;
            color: var(--primary-600);
            padding: var(--space-3) var(--space-5);
            border: 2px solid var(--primary-200);
            border-radius: var(--radius-full);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            box-shadow: var(--shadow-md);
        }

        .lang-btn:hover {
            background: var(--primary-50);
            border-color: var(--primary-400);
            transform: translateY(-2px);
        }

        /* Header Section */
        .dashboard-header {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            box-shadow: var(--shadow-card);
            margin-bottom: var(--space-6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-6);
            animation: fadeInDown 0.6s ease-out;
        }

        .doctor-profile {
            display: flex;
            align-items: center;
            gap: var(--space-5);
        }

        .doctor-avatar {
            width: 72px;
            height: 72px;
            background: var(--gradient-primary);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 14px rgba(0, 180, 204, 0.3);
        }

        .doctor-info h1 {
            font-size: 1.5rem;
            color: var(--neutral-800);
            margin-bottom: var(--space-1);
        }

        .doctor-info p {
            color: var(--neutral-500);
            font-size: 0.95rem;
        }

        .doctor-department {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            background: var(--primary-50);
            color: var(--primary-700);
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: var(--space-2);
        }

        .header-stats {
            display: flex;
            gap: var(--space-4);
        }

        .stat-card {
            background: var(--gradient-primary);
            color: white;
            padding: var(--space-5) var(--space-6);
            border-radius: var(--radius-lg);
            text-align: center;
            min-width: 120px;
            box-shadow: 0 4px 14px rgba(0, 180, 204, 0.3);
        }

        .stat-card h3 {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: var(--space-1);
        }

        .stat-card p {
            font-size: 0.85rem;
            opacity: 0.9;
            color: white;
        }

        .stat-card.secondary {
            background: linear-gradient(135deg, var(--success) 0%, #047857 100%);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .btn-logout {
            background: linear-gradient(135deg, var(--error) 0%, #b91c1c 100%);
            color: white;
            padding: var(--space-3) var(--space-5);
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        /* Current Patient Section */
        .section-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            box-shadow: var(--shadow-card);
            margin-bottom: var(--space-6);
            animation: fadeInUp 0.6s ease-out;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--neutral-800);
            margin-bottom: var(--space-5);
        }

        .section-title-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-50);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* Patient Card */
        .patient-card {
            background: linear-gradient(135deg, var(--success) 0%, #047857 100%);
            color: white;
            padding: var(--space-6);
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
        }

        .patient-card.empty {
            background: var(--neutral-50);
            color: var(--neutral-500);
            text-align: center;
            padding: var(--space-12);
            box-shadow: none;
            border: 2px dashed var(--neutral-200);
        }

        .patient-card.empty .empty-icon {
            font-size: 3rem;
            margin-bottom: var(--space-4);
            opacity: 0.5;
        }

        .patient-card.empty h3 {
            color: var(--neutral-600);
            margin-bottom: var(--space-2);
        }

        .patient-card.empty p {
            color: var(--neutral-400);
        }

        .patient-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--space-4);
            margin-bottom: var(--space-5);
        }

        .patient-detail {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .patient-detail label {
            font-size: 0.8rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .patient-detail span {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .symptoms-section {
            background: rgba(255, 255, 255, 0.15);
            padding: var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-5);
        }

        .symptoms-section label {
            font-size: 0.8rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: var(--space-2);
        }

        .symptoms-section p {
            color: white;
            line-height: 1.6;
        }

        .patient-actions {
            display: flex;
            gap: var(--space-4);
        }

        .btn-action {
            flex: 1;
            padding: var(--space-4);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }

        .btn-complete {
            background: white;
            color: var(--success);
        }

        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.4);
        }

        .btn-skip {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .btn-skip:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Queue List */
        .queue-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-5);
        }

        .queue-count {
            background: var(--primary-100);
            color: var(--primary-700);
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .queue-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .queue-item {
            background: var(--neutral-50);
            padding: var(--space-4) var(--space-5);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            transition: all var(--transition-base);
            border: 1px solid var(--neutral-100);
        }

        .queue-item:hover {
            background: var(--primary-50);
            border-color: var(--primary-200);
            transform: translateX(4px);
        }

        .queue-item-info {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            flex: 1;
        }

        .queue-token {
            background: var(--gradient-primary);
            color: white;
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 80px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 180, 204, 0.3);
        }

        .queue-patient-info h4 {
            color: var(--neutral-800);
            font-size: 1rem;
            margin-bottom: var(--space-1);
        }

        .queue-patient-info p {
            color: var(--neutral-500);
            font-size: 0.85rem;
        }

        .queue-time {
            color: var(--neutral-400);
            font-size: 0.85rem;
            text-align: right;
            white-space: nowrap;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: var(--space-12);
            color: var(--neutral-400);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: var(--space-4);
        }

        .empty-state h3 {
            color: var(--neutral-600);
            margin-bottom: var(--space-2);
        }

        /* Refresh Indicator */
        .refresh-indicator {
            position: fixed;
            bottom: var(--space-6);
            right: var(--space-6);
            background: white;
            padding: var(--space-3) var(--space-5);
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            z-index: 999;
            font-size: 0.85rem;
            color: var(--neutral-600);
        }

        .refresh-dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: var(--radius-full);
            animation: pulse 2s infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                text-align: center;
            }

            .doctor-profile {
                flex-direction: column;
            }

            .header-stats {
                width: 100%;
                justify-content: center;
            }

            .patient-details {
                grid-template-columns: 1fr;
            }

            .patient-actions {
                flex-direction: column;
            }

            .queue-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .queue-item-info {
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
            }

            .queue-time {
                text-align: left;
            }

            .language-toggle {
                top: auto;
                bottom: 80px;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="cf-header">
        <div class="container">
            <div class="cf-header-inner">
                <a href="index.html" class="cf-logo">
                    <div class="cf-logo-icon">⚕️</div>
                    <div class="cf-logo-text">Care<span>Flow</span></div>
                </a>
                <nav class="cf-nav">
                    <a href="queueTracker.html" class="cf-nav-link">Queue Display</a>
                    <button class="btn-logout" onclick="logout()">
                        🚪 Logout
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Language Toggle -->
    <div class="language-toggle">
        <button class="lang-btn" onclick="toggleLanguage()">
            <span>🌐</span>
            <span id="langBtnText">தமிழ்</span>
        </button>
    </div>

    <div class="dashboard-container">
        <!-- Dashboard Header -->
        <section class="dashboard-header">
            <div class="doctor-profile">
                <div class="doctor-avatar">👨‍⚕️</div>
                <div class="doctor-info">
                    <h1 id="dashboardTitle">Doctor Dashboard</h1>
                    <p>Welcome, <span id="doctorName">Doctor</span></p>
                    <div class="doctor-department" id="doctorDepartment">
                        <span>🏥</span>
                        <span>General Medicine</span>
                    </div>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-card">
                    <h3 id="totalToday">0</h3>
                    <p id="totalTodayLabel">Today</p>
                </div>
                <div class="stat-card secondary">
                    <h3 id="completedToday">0</h3>
                    <p id="completedTodayLabel">Completed</p>
                </div>
            </div>
        </section>

        <!-- Current Patient Section -->
        <section class="section-card">
            <div class="section-title">
                <div class="section-title-icon">👤</div>
                <span id="currentPatientTitle">Current Patient</span>
            </div>
            <div id="currentPatientCard"></div>
        </section>

        <!-- Queue Section -->
        <section class="section-card">
            <div class="queue-header">
                <div class="section-title" style="margin-bottom: 0;">
                    <div class="section-title-icon">📋</div>
                    <span id="queueTitle">Waiting Queue</span>
                </div>
                <span class="queue-count" id="queueCount">0 patients</span>
            </div>
            <div id="queueList" class="queue-list"></div>
        </section>
    </div>

    <!-- Refresh Indicator -->
    <div class="refresh-indicator">
        <div class="refresh-dot"></div>
        <span id="refreshText">Auto-refreshing</span>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // SESSION AUTHENTICATION CHECK
        // ═══════════════════════════════════════════════════════════════

        function checkAuthentication() {
            const session = localStorage.getItem('doctorSession');
            if (!session) {
                alert('Please login first!');
                window.location.href = 'doctorLogin.html';
                return null;
            }
            const doctorSession = JSON.parse(session);
            if (!doctorSession.isLoggedIn) {
                alert('Session expired. Please login again!');
                window.location.href = 'doctorLogin.html';
                return null;
            }
            return doctorSession;
        }

        const doctorSession = checkAuthentication();
        if (!doctorSession) {
            throw new Error('Not authenticated');
        }

        // Language translations
        const translations = {
            en: {
                langBtn: 'தமிழ்',
                dashboardTitle: 'Doctor Dashboard',
                totalTodayLabel: 'Today',
                completedTodayLabel: 'Completed',
                currentPatientTitle: 'Current Patient',
                queueTitle: 'Waiting Queue',
                refreshText: 'Auto-refreshing',
                noPatient: 'No patient currently being consulted',
                callNext: 'Call next patient to begin consultation',
                tokenLabel: 'Token',
                nameLabel: 'Name',
                ageLabel: 'Age',
                genderLabel: 'Gender',
                contactLabel: 'Contact',
                symptomsLabel: 'Symptoms',
                completeBtn: '✓ Complete Consultation',
                skipBtn: '→ Skip Patient',
                waitingSince: 'Waiting',
                emptyQueue: 'No patients in queue',
                allCaughtUp: 'All caught up! No waiting patients.',
                patientsLabel: 'patients'
            },
            ta: {
                langBtn: 'English',
                dashboardTitle: 'மருத்துவர் பலகை',
                totalTodayLabel: 'இன்று',
                completedTodayLabel: 'முடிந்தது',
                currentPatientTitle: 'தற்போதைய நோயாளி',
                queueTitle: 'காத்திருப்பு வரிசை',
                refreshText: 'தானாக புதுப்பிக்கப்படுகிறது',
                noPatient: 'தற்போது எந்த நோயாளியும் ஆலோசனையில் இல்லை',
                callNext: 'ஆலோசனையைத் தொடங்க அடுத்த நோயாளியை அழைக்கவும்',
                tokenLabel: 'டோக்கன்',
                nameLabel: 'பெயர்',
                ageLabel: 'வயது',
                genderLabel: 'பாலினம்',
                contactLabel: 'தொலைபேசி',
                symptomsLabel: 'அறிகுறிகள்',
                completeBtn: '✓ ஆலோசனையை முடிக்கவும்',
                skipBtn: '→ தவிர்க்கவும்',
                waitingSince: 'காத்திருப்பு',
                emptyQueue: 'வரிசையில் நோயாளிகள் இல்லை',
                allCaughtUp: 'அனைத்தும் முடிந்தது!',
                patientsLabel: 'நோயாளிகள்'
            }
        };

        let currentLang = 'en';
        let currentPatient = null;
        let refreshInterval = null;
        let ws = null;

        // WebSocket connection
        function connectWebSocket() {
            try {
                ws = new WebSocket('ws://localhost:3000');
                ws.onopen = () => console.log('WebSocket connected');
                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        if (['INITIAL_QUEUE', 'NEW_REGISTRATION', 'STATUS_UPDATE'].includes(message.type)) {
                            refresh();
                        }
                    } catch (error) {
                        console.error('WebSocket message error:', error);
                    }
                };
                ws.onerror = (error) => console.error('WebSocket error:', error);
                ws.onclose = () => {
                    console.log('WebSocket disconnected. Reconnecting...');
                    setTimeout(connectWebSocket, 5000);
                };
            } catch (error) {
                console.error('WebSocket connection failed:', error);
                setTimeout(connectWebSocket, 5000);
            }
        }

        function initializeLanguage() {
            const savedLang = localStorage.getItem('preferredLanguage');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
            }
            applyLanguage(currentLang);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ta' : 'en';
            localStorage.setItem('preferredLanguage', currentLang);
            applyLanguage(currentLang);
        }

        function applyLanguage(lang) {
            const t = translations[lang];
            document.getElementById('langBtnText').textContent = t.langBtn;
            document.getElementById('dashboardTitle').textContent = t.dashboardTitle;

            if (doctorSession) {
                document.getElementById('doctorName').textContent = `Dr. ${doctorSession.name}`;
                const deptEl = document.getElementById('doctorDepartment');
                if (doctorSession.department) {
                    deptEl.innerHTML = `<span>🏥</span><span>${doctorSession.department}</span>`;
                }
            }

            document.getElementById('totalTodayLabel').textContent = t.totalTodayLabel;
            document.getElementById('completedTodayLabel').textContent = t.completedTodayLabel;
            document.getElementById('currentPatientTitle').textContent = t.currentPatientTitle;
            document.getElementById('queueTitle').textContent = t.queueTitle;
            document.getElementById('refreshText').textContent = t.refreshText;

            displayCurrentPatient();
            displayQueue();
        }

        async function getQueue() {
            try {
                const response = await fetch('http://localhost:3000/api/queue');
                const data = await response.json();
                return data.success ? (data.queue || []) : [];
            } catch (error) {
                console.error('Error fetching queue:', error);
                return [];
            }
        }

        async function saveQueueStatus(queueId, status) {
            try {
                const response = await fetch(`http://localhost:3000/api/queue/${queueId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                return await response.json();
            } catch (error) {
                console.error('Error updating status:', error);
                return { success: false };
            }
        }

        async function getFilteredQueue() {
            const queue = await getQueue();
            return queue.filter(p => p.status === 'Waiting');
        }

        async function getNextPatient() {
            const filteredQueue = await getFilteredQueue();
            return filteredQueue.length > 0 ? filteredQueue[0] : null;
        }

        function displayCurrentPatient() {
            const t = translations[currentLang];
            const container = document.getElementById('currentPatientCard');

            if (!currentPatient) {
                container.innerHTML = `
                    <div class="patient-card empty">
                        <div class="empty-icon">👤</div>
                        <h3>${t.noPatient}</h3>
                        <p>${t.callNext}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="patient-card">
                    <div class="patient-details">
                        <div class="patient-detail">
                            <label>${t.tokenLabel}</label>
                            <span>${currentPatient.token}</span>
                        </div>
                        <div class="patient-detail">
                            <label>${t.nameLabel}</label>
                            <span>${currentPatient.name}</span>
                        </div>
                        <div class="patient-detail">
                            <label>${t.ageLabel}</label>
                            <span>${currentPatient.age} years</span>
                        </div>
                        <div class="patient-detail">
                            <label>${t.genderLabel}</label>
                            <span>${currentPatient.gender}</span>
                        </div>
                        <div class="patient-detail">
                            <label>${t.contactLabel}</label>
                            <span>${currentPatient.contact}</span>
                        </div>
                        <div class="patient-detail">
                            <label>Visit Count</label>
                            <span>${currentPatient.visit_count || 1}</span>
                        </div>
                    </div>
                    <div class="symptoms-section">
                        <label>${t.symptomsLabel}</label>
                        <p>${currentPatient.symptoms || 'No symptoms recorded'}</p>
                    </div>
                    <div class="patient-actions">
                        <button class="btn-action btn-complete" onclick="completeConsultation()">
                            ${t.completeBtn}
                        </button>
                        <button class="btn-action btn-skip" onclick="skipPatient()">
                            ${t.skipBtn}
                        </button>
                    </div>
                </div>
            `;
        }

        async function displayQueue() {
            const t = translations[currentLang];
            const filteredQueue = await getFilteredQueue();
            const container = document.getElementById('queueList');
            const countEl = document.getElementById('queueCount');

            const displayQueueList = currentPatient ? filteredQueue.slice(1) : filteredQueue;
            countEl.textContent = `${displayQueueList.length} ${t.patientsLabel}`;

            if (displayQueueList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <h3>${t.emptyQueue}</h3>
                        <p>${t.allCaughtUp}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = displayQueueList.map(patient => {
                const waitTime = getWaitTime(patient.registered_at);
                const symptoms = (patient.symptoms || '').substring(0, 40);
                return `
                    <div class="queue-item">
                        <div class="queue-item-info">
                            <div class="queue-token">${patient.token}</div>
                            <div class="queue-patient-info">
                                <h4>${patient.name}</h4>
                                <p>${patient.age} years • ${patient.gender}${symptoms ? ' • ' + symptoms + '...' : ''}</p>
                            </div>
                        </div>
                        <div class="queue-time">
                            ${t.waitingSince} ${waitTime}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getWaitTime(registeredAt) {
            const now = new Date();
            const registered = new Date(registeredAt);
            const diffMs = now - registered;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min`;
            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            return `${hours}h ${mins}m`;
        }

        async function updateStats() {
            const queue = await getQueue();
            const today = new Date().toDateString();

            const todayPatients = queue.filter(p => {
                const regDate = new Date(p.registered_at).toDateString();
                return regDate === today;
            });

            const completed = todayPatients.filter(p => p.status === 'Completed');

            document.getElementById('totalToday').textContent = todayPatients.length;
            document.getElementById('completedToday').textContent = completed.length;
        }

        async function callNextPatient() {
            if (!currentPatient) {
                const next = await getNextPatient();
                if (next) {
                    currentPatient = next;
                    displayCurrentPatient();
                }
            }
        }

        async function completeConsultation() {
            if (!currentPatient) return;
            await saveQueueStatus(currentPatient.queue_id, 'Completed');
            currentPatient = null;
            await refresh();
            await callNextPatient();
        }

        async function skipPatient() {
            if (!currentPatient) return;
            await saveQueueStatus(currentPatient.queue_id, 'Skipped');
            currentPatient = null;
            await refresh();
            await callNextPatient();
        }

        async function refresh() {
            await updateStats();
            displayCurrentPatient();
            await displayQueue();
        }

        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                refresh();
                if (!currentPatient) callNextPatient();
            }, 3000);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('doctorSession');
                window.location.href = 'doctorLogin.html';
            }
        }

        window.onload = async function () {
            initializeLanguage();
            connectWebSocket();
            await refresh();
            await callNextPatient();
            startAutoRefresh();
        };

        window.onbeforeunload = function () {
            if (refreshInterval) clearInterval(refreshInterval);
            if (ws) ws.close();
        };
    </script>
</body>

</html>
